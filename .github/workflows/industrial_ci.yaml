---
name: Industrial CI
on:
  workflow_call:
  workflow_dispatch:
  push:


jobs:

  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
      - uses: pre-commit/action@v3.0.1

  ros_industrial_ci:
    name: ROS Industrial CI
    needs:
      - pre-commit
    strategy:
      fail-fast: false
      matrix:
        ROS_DISTRO: [humble]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HUSARION_ROS_BUILD_TYPE: simulation
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup ROS2 Workspace and Clone Repositories
        run: |
          mkdir -p src
          find . -maxdepth 1 -not -name src -not -name . -exec mv {} src/ \;
          python3 -m pip install -U vcstool
          vcs import src < src/rosbot/rosbot_$HUSARION_ROS_BUILD_TYPE.repos

      - name: Leave only ROSbot tests
        shell: bash
        run: |
          sed '/if(BUILD_TESTING)/,/endif()/d' src/micro_ros_msgs/CMakeLists.txt -i

      - uses: ros-industrial/industrial_ci@master
        env:
          ROS_DISTRO: ${{matrix.ROS_DISTRO}}
          HUSARION_ROS_BUILD_TYPE: simulation
